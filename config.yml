####################################### Bank Statements parameters #########################################

initial_bank_values:
  reserve_ratio: 0.1 # How many of the assets need to be hold by the bank and not be lend at the beginning of the game
  reference_rate: 0.02 # The defined by the central bank rate at the beginning of the game
  saving_rate: 0.01 # The base rate paid by the bank to the account holders at the beginning of the game
  lending_rate_base: 0.04 # The base rate paid to the bank by the loan holders at the beginning of the game
  initial_deposits: 1000000 # Original deposits hold by the bsnk st the beginning of the game
  initial_equity: 100000 # Initial equity at the beginning of the game
  retained_earnings: 100000 # Initial retained earnings at the beginning of the game


####################################### Data generation parameters #########################################

### ------- Data_generator/data_generator.py

# General parameters ---->

number_years_previous_game: 5 # This is to generate the macroeconomic data for the previous years before the game

number_of_customers_1: 1000

# Parameters for variables generation ---->

# Name related
default_name_prefix: "name"

# Age related
age_min: 30
age_max: 65

# Education related
education: 
  levels:
    - "high school or lower"
    - "ausbildung"
    - "bachelor degree"
    - "post graduate degree"
  weights:
    - 0.3
    - 0.3
    - 0.3
    - 0.1

# Past credits related
past_credits:
  levels:
    - 0
    - 1
    - 2
    - 3
  weights:
    - 0.6
    - 0.3
    - 0.08
    - 0.02

# General probability that in one year the person will accumulate a not paid credit based on past credits
past_credits_sensibility: 0.1


# Dependents related
dependents:
  levels:
    - 0
    - 1
    - 2
    - 3
    - 4
  weights:
    - 0.6
    - 0.3
    - 0.06
    - 0.03
    - 0.01

# General probability that a person will have a new dependent 
dependents_sensitivity: 0.1 

### ------- Data_generator/data_generator_functions.py

# Parameters for variables generation ---->

