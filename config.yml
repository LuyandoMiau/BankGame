    to_LowSkilled: 0.35
    to_MediumSkilled: 0.05
    to_HighSkilled: 0.0
  MediumSkilled:
    to_Unemployed_MediumSkilled: 0.1
    to_LowSkilled: 0.1
    to_MediumSkilled: 0.7
    to_HighSkilled: 0.1
  Unemployed_MediumSkilled:
    to_Unemployed_MediumSkilled: 0.6
    to_MediumSkilled: 0.38
    to_HighSkilled: 0.02
    to_LowSkilled: 0.0
  HighSkilled:
    to_Unemployed_HighSkilled: 0.1
    to_LowSkilled: 0.0
    to_MediumSkilled: 0.1
    to_HighSkilled: 0.8
  Unemployed_HighSkilled:
