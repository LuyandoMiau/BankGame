# Transition probabilities for working sectors are modeled randomly in data_dynamics.py

# Income related
# Assuming unemployement money is 50% of the income of the employed in the same skill category
income_params:
  LowSkilled:
    min: 1000
    max: 5000
  Unemployed_LowSkilled:
    min: 500
    max: 2500
  MediumSkilled:
    min: 1200
    max: 10000
  Unemployed_MediumSkilled:
    min: 600
    max: 5000
  HighSkilled:
    min: 1600
    max: 20000
  Unemployed_HighSkilled:
    min: 800
    max: 10000

# This is to define the type of function to generate income based on age
# We can have four types of functions: 
# linear: grows linearly with age, steady growth
# quadratic: grows quadratically with age, steady early growth then fast later growth
# exponential: grows exponentially with age, slow early growth then fast later growth
# logarithmic: grows logarithmically with age, fast early growth then stabilizes
# sigmoid: grows sigmoidally with age, slow early growth, fast middle growth, then stabilizes
# step: income jumps at certain age thresholds
type_of_function_income: "sigmoid"
step_steps: 5 # number of steps if step function is chosen


# Expenditure related
expenditure_params:
  low_income_params: # in case income lower than average income
    dependents: # left, mode, right for triangular distribution
      - [0.5, 0.7, 1.5] # for 0 dependents
      - [0.7, 0.8, 1.5] # for 1 dependent
      - [0.8, 0.9, 1.5] # for 2 dependents
      - [0.9, 1.0, 1.5] # for 3 dependents
      - [1.0, 1.1, 1.5] # for 4 dependents
  high_income_params: # in case income higher or equal than average income
    dependents: # left, mode, right for triangular distribution
      - [0.3, 0.5, 1.2] # for 0 dependents
      - [0.4, 0.6, 1.2] # for 1 dependent
      - [0.5, 0.7, 1.2] # for 2 dependents
      - [0.6, 0.8, 1.2] # for 3 dependents
      - [0.7, 0.9, 1.2] # for 4 dependents

# Credit characteristics related
credit_characteristics:
  duration_loan:
    duration_months:
      - 12
      - 24
      - 36
      - 48
      - 60
    weights:
      - 0.2
      - 0.3
      - 0.2
      - 0.2
      - 0.1
  percentage_monthly_income:
    max: 1.0
    min: 0.2
  types_of_loan:
    - "mortgages"
    - "auto loans"
    - "simple loans"

# Collateral related
collateral:
  types:
    - "house"
    - "car"
    - "liquid assets"
    - "none"
  thresholds:
    - 50000 # House
    - 20000 # Car
    - 0 # Liquid assets
    - 0 # None
  amount_per_type:
    HighSkilled:
      per_no_collateral: 0.10 # percentage of people with no collateral
      Boundaries: [10000, 80000] # min and max collateral value
    MediumSkilled:
      per_no_collateral: 0.20 # percentage of people with no collateral
      Boundaries: [10000, 50000] # min and max collateral value
    LowSkilled:
      per_no_collateral: 0.35 # percentage of people with no collateral
      Boundaries: [5000, 25000]  # min and max collateral value

# Estimated seizable assets related
seizable_assets_multiplier:
  HighSkilled: 1.2
  MediumSkilled: 1.0
  LowSkilled: 0.8

# y-variable related
y_variable:
  risk_settings:
    Unemployed_LowSkilled:
      base: 0.15 # base probability of default
      weights: [0.30, 0.6, 0.4] # base probability of default and weights (past credits, debt to income before credit, credit to income)
    LowSkilled:
      base: 0.08 # base probability of default
      weights: [0.20, 0.5, 0.3] # base probability of default and weights (past credits, debt to income before credit, credit to income)
    Unemployed_MediumSkilled:
      base: 0.12 # base probability of default
      weights: [0.30, 0.5, 0.3] # base probability of default and weights (past credits, debt to income before credit, credit to income)
    MediumSkilled:
      base: 0.05 # base probability of default
      weights: [0.20, 0.45, 0.25] # base probability of default and weights (past credits, debt to income before credit, credit to income)
    Unemployed_HighSkilled:
      base: 0.09 # base probability of default
      weights: [0.30, 0.45, 0.25] # base probability of default and weights (past credits, debt to income before credit, credit to income)
    HighSkilled:
      base: 0.02 # base probability of default
      weights: [0.20, 0.4, 0.2] # base probability of default and weights (past credits, debt to income before credit, credit to income)
  sector_risk_modifier: # extra risk modifier based on working sector
    LowSkilled:
      Construction: 0.03
      Agriculture: 0.02
      Manufacturing: 0.01
      Transportation: 0.025
      Cleaning Services: 0.04
    MediumSkilled:
      Nursing: -0.01
      Teacher: -0.015
      IT Support: 0.0
      Electrician: 0.01
      Artist: 0.03
    HighSkilled:
      Finance: -0.02
      Engineering: -0.015
      Research: -0.01
      Consultant: 0.0
      Doctor: -0.025

####################################### PD, LGD, EAD Modelling ###############################################

###### PD ##################################

### ------- PD_estimation.py

PD_main_function:
  neuronal_network:
    epochs: 20 # Number of epochs for training the neural network
    batch_size: 32 # Batch size for training the neural network
    first_layer_activation_function: 'tanh' # Activation function for the first layer of the neural network
    second_layer_activation_function: 'tanh' # Activation function for the second layer of the neural network
    third_layer_activation_function: 'sigmoid' # Activation function for the output layer of the neural network
  random_forests:
    n_estimators: 100 # Number of trees in the random forest model
    random_state: 42 # Random state for reproducibility
  others:
    iterations: 1 # number of iterations for Monte Carlo simulation, change it to 100 or more for better results

###### Interest rates ##################################

### ------- original_i_rates_estimation.py

interest_rates:
  base_rate: null # initial_bank_values:reference_rate defined above will be pulled using pythong in original_i_rates_estimation
  max_interest_rate: 0.5  # Maximum interest rate allowed. This one will be set by the bank, based on its risk appetite and other factors
  credit_to_income_ratio_factor: 0.04  # Factor for credit-to-income ratio
  loan_duration_factor: 0.01  # Factor for loan duration
  debt_factor: 0.02  # Factor for debt-to-income ratio
  asset_factor: 0.03  # Factor for estimated seizable assets

