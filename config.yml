###### Gaussian_copula_estimation ##################################

### ------- Gaussian_factor_copula.py

gaussian_copula:
  third_step: # Simulate default indicators using a Gaussian factor copula model with group-level and macroeconomic factors.
    n_sim: 1000 # number of Monte Carlo simulations
    rho_macro: 0.1 # weight for macroeconomic factor
    rho_group: 0.2 # weight for group-level factors
  fifth_step: # Estimate the capital per borrower using the IRB approach.
    rho: 0.15 # Correlation parameter
  ninth_step: # In this part, the top N borrowers with the highest joint default probabilities for each borrower are identified
    top_n: 5 # number of top borrowers to identify




